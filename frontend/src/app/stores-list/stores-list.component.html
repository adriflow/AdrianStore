<div class="flex min-h-screen flex-col bg-cream text-neutral-800">
  <header class="sticky top-0 z-50 border-b border-neutral-900/5 bg-white/80 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <button type="button" (click)="goHome()" class="flex items-center gap-2.5">
        <img src="assets/logo.png" alt="Logo AdrianStore" class="h-9 w-9 rounded-xl object-contain" />
        <span class="text-left">
          <span class="block font-display text-base font-bold leading-tight text-neutral-900">AdrianStore</span>
          <span class="block text-[11px] leading-tight text-neutral-400">Catálogo en línea</span>
        </span>
      </button>
      <div class="flex items-center gap-3">
        <a routerLink="/" class="rounded-full border border-neutral-200 px-4 py-1.5 text-sm font-semibold text-neutral-600 transition hover:border-leaf-300 hover:text-leaf-700">Inicio</a>
        <a routerLink="/negocios" class="rounded-full bg-leaf-600 px-4 py-1.5 text-sm font-semibold text-white transition hover:bg-leaf-700">Negocios</a>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-14 sm:px-6 lg:px-8">
    <div class="reveal reveal-in mx-auto mb-10 max-w-2xl text-center">
      <span class="text-xs font-semibold uppercase tracking-widest text-leaf-600">Negocios</span>
      <h2 class="mt-3 font-display text-3xl font-bold tracking-tight text-neutral-900 sm:text-4xl">Explora los negocios del catálogo</h2>
      <p class="mt-3 text-neutral-500">Cada negocio tiene su propio espacio con sus productos, color y contacto directo.</p>
    </div>

    <div *ngIf="isLoading" class="py-20 text-center text-neutral-400">Cargando negocios...</div>

    <div *ngIf="loadError" class="mx-auto max-w-md rounded-2xl border border-red-200 bg-red-50 px-6 py-4 text-center text-sm font-medium text-red-600">{{ loadError }}</div>

    <div *ngIf="!isLoading && !loadError && stores.length === 0" class="py-20 text-center">
      <p class="font-display text-xl text-neutral-600">Aún no hay negocios.</p>
      <p class="mt-2 text-sm text-neutral-400">Prueba más tarde, estamos preparando nuevos espacios.</p>
    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <button
        *ngFor="let store of stores"
        type="button"
        (click)="goToStore(store)"
        class="reveal reveal-in group flex flex-col items-start gap-4 rounded-3xl border border-neutral-900/5 bg-white p-6 text-left shadow-soft transition duration-300 hover:-translate-y-1 hover:shadow-lift"
      >
        <div class="flex w-full items-center justify-between gap-3">
          <span
            class="flex h-14 w-14 items-center justify-center rounded-2xl font-display text-xl font-bold text-white"
            [style.background-color]="accent(store)"
          >
            {{ store.name.charAt(0).toUpperCase() }}
          </span>
          <span class="rounded-full bg-neutral-100 px-3 py-1 text-xs font-semibold text-neutral-500">Ver espacio</span>
        </div>
        <span>
          <span class="block font-display text-lg font-bold text-neutral-900">{{ store.name }}</span>
          <span class="mt-1 block text-sm text-neutral-500">Productos y compra directa por WhatsApp.</span>
        </span>
      </button>
    </div>
  </main>
</div>
