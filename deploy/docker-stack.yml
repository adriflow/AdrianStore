# Stack de Swarm para el backend de AdrianStore. NO incluye Postgres: se conecta
# a `postgres-public` para llegar a una base ya desplegada en otro stack.
#
# Redes externas requeridas (deben existir ya en el swarm):
#   docker network create --driver overlay traefik-public   # si no existe
#   docker network create --driver overlay postgres-public  # si no existe
#
# Uso:
#   1. Construir y publicar la imagen (contexto = raíz del repo, no backend/):
#        docker build -f backend/Dockerfile -t <tu-registro>/adrianstore-backend:latest .
#        docker push <tu-registro>/adrianstore-backend:latest
#   2. export $(grep -v '^#' deploy/stack.env | xargs)   # docker stack deploy NO lee .env solo
#   3. docker stack deploy -c deploy/docker-stack.yml adrianstore
#
# Sin volúmenes: las imágenes van a Cloudflare R2 (ver backend/.env.example), el
# contenedor es stateless -> puede correr con cualquier número de réplicas... con
# la excepción del rate limiting (ver nota en healthcheck/deploy más abajo).

version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/vladimir1284/adrianstore-backend}:${BACKEND_TAG:-latest}
    networks:
      - traefik-public
      - postgres-public
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Host de DATABASE_URL = nombre del servicio Postgres tal como lo resuelve
      # postgres-public (p. ej. postgres://user:pass@postgres:5432/adrianstore).
      # AJUSTAR: no conozco el nombre real del servicio en tu stack de Postgres.
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_URL: ${BACKEND_URL:-https://api.adrianstore.ladetec.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://adrianstore.ladetec.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-adrian0502}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-20}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-5}
      LOGIN_THROTTLE_TTL: ${LOGIN_THROTTLE_TTL:-60000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      # ThrottlerGuard guarda contadores en memoria del proceso: con replicas > 1
      # el límite de rate limiting se vuelve "N veces el límite" (cada réplica
      # cuenta aparte). Súbelo solo si migras el throttler a un store compartido
      # (Redis) o aceptas ese efecto.
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        # AJUSTAR entrypoints/certresolver al nombre real configurado en tu Traefik
        # (esto sigue la convención típica http/https + certresolver "le"; si tu
        # traefik-public usa otros nombres, cámbialos aquí).
        - traefik.http.routers.adrianstore-backend-http.rule=Host(`${BACKEND_DOMAIN:-api.adrianstore.ladetec.com}`)
        - traefik.http.routers.adrianstore-backend-http.entrypoints=http
        - traefik.http.routers.adrianstore-backend-http.middlewares=https-redirect
        - traefik.http.routers.adrianstore-backend-https.rule=Host(`${BACKEND_DOMAIN:-api.adrianstore.ladetec.com}`)
        - traefik.http.routers.adrianstore-backend-https.entrypoints=https
        - traefik.http.routers.adrianstore-backend-https.tls=true
        - traefik.http.routers.adrianstore-backend-https.tls.certresolver=le
        - traefik.http.services.adrianstore-backend.loadbalancer.server.port=3000
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

networks:
  traefik-public:
    external: true
  postgres-public:
    external: true
