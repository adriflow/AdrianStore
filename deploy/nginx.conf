# Configuración alternativa para nginx (con certificado Let's Encrypt).
# Si usas Caddy no necesitas este archivo.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name adrianstore.ladetec.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adrianstore.ladetec.com;

    ssl_certificate     /etc/letsencrypt/live/adrianstore.ladetec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adrianstore.ladetec.com/privkey.pem;

    root /opt/adrianstore/frontend/dist/adrianstore-frontend;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }
}
